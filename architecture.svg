<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="710" fill="#ffffff"/>
  <text x="1176" y="26" text-anchor="end" font-size="14" font-weight="bold" fill="#1f2933">Co-Lectr &#8212; architecture</text>

  <!-- ===== trigger ===== -->
  <rect x="24" y="26" width="236" height="64" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="142" y="52" text-anchor="middle" font-size="12.5" fill="#1f2933">Student opens a pull request</text>
  <text x="142" y="70" text-anchor="middle" font-size="11" fill="#5b6b7b">or: submissions folder &#183; adk web</text>

  <rect x="330" y="20" width="300" height="78" rx="10" fill="#eef2f7" stroke="#9aa5b1"/>
  <text x="480" y="44" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Cloud Run &#8212; web.py</text>
  <text x="480" y="62" text-anchor="middle" font-size="11" fill="#1f2933">POST /webhook &#183; HMAC signature-checked</text>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#5b6b7b">GET / &#8212; health check</text>

  <line x1="260" y1="58" x2="330" y2="58" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="295" y="52" text-anchor="middle" font-size="11" font-style="italic" fill="#5b6b7b">webhook</text>

  <!-- ===== core ===== -->
  <rect x="300" y="150" width="440" height="372" rx="12" fill="#f5f7fa" stroke="#b8c2cc"/>
  <text x="520" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#47535f">Review core &#8212; shared by CLI, webhook and adk web</text>

  <rect x="322" y="188" width="396" height="96" rx="8" fill="#e8f0fe" stroke="#6b9bd1"/>
  <text x="520" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Layer 1 &#8212; deterministic (no LLM)</text>
  <text x="520" y="232" text-anchor="middle" font-size="12" fill="#1f2933">ast &#183; ruff &#183; pytest  &#8594;  findings</text>
  <text x="520" y="250" text-anchor="middle" font-size="11" fill="#1f2933">stable rule ids: ruff:E722 &#183; spec:missing-symbol</text>
  <text x="520" y="268" text-anchor="middle" font-size="11" fill="#5b6b7b">layer1.py</text>

  <rect x="322" y="360" width="396" height="128" rx="8" fill="#e6f4ea" stroke="#6aa84f"/>
  <text x="520" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Layer 2 &#8212; ADK LlmAgent &#183; Gemini 3.5 Flash</text>
  <text x="520" y="406" text-anchor="middle" font-size="11.5" fill="#1f2933">reviewer.py &#8212; questions only, injection-guarded</text>
  <text x="520" y="424" text-anchor="middle" font-size="11.5" fill="#1f2933">model output validated back against Layer 1</text>
  <text x="520" y="442" text-anchor="middle" font-size="11" fill="#5b6b7b">never emits fixes</text>

  <line x1="520" y1="284" x2="520" y2="360" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="530" y="326" font-size="11" font-style="italic" fill="#5b6b7b">facts it may not dispute</text>

  <line x1="470" y1="98" x2="470" y2="188" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="478" y="128" font-size="11" font-style="italic" fill="#5b6b7b">background worker</text>
  <text x="478" y="142" font-size="11" font-style="italic" fill="#5b6b7b">(pool or Cloud Tasks)</text>

  <path d="M142,90 C 142,150 210,196 322,200" fill="none" stroke="#5b6b7b" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="150" y="118" font-size="11" font-style="italic" fill="#5b6b7b">local run</text>

  <!-- ===== inputs ===== -->
  <rect x="24" y="300" width="236" height="58" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="142" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Student code</text>
  <text x="142" y="342" text-anchor="middle" font-size="11" fill="#5b6b7b">untrusted &#8212; passed as data</text>

  <rect x="24" y="384" width="236" height="58" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="142" y="410" text-anchor="middle" font-size="12" fill="#1f2933">Chapters taught +</text>
  <text x="142" y="428" text-anchor="middle" font-size="12" fill="#1f2933">required symbols</text>

  <line x1="260" y1="329" x2="322" y2="400" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <line x1="260" y1="413" x2="322" y2="432" stroke="#5b6b7b" marker-end="url(#arrow)"/>

  <!-- ===== right column ===== -->
  <rect x="800" y="182" width="376" height="54" rx="8" fill="#e8f0fe" stroke="#6b9bd1"/>
  <text x="988" y="214" text-anchor="middle" font-size="12.5" fill="#1f2933">Aggregator &#8212; per class &#183; aggregator.py</text>

  <rect x="800" y="252" width="376" height="56" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="988" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Class digest</text>
  <text x="988" y="293" text-anchor="middle" font-size="11.5" fill="#1f2933">4 / 6 in 12-A wrote a bare except:</text>

  <rect x="800" y="330" width="376" height="86" rx="8" fill="#e6f4ea" stroke="#6aa84f"/>
  <text x="988" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Questions &#8212; anchored to file:line</text>
  <text x="988" y="375" text-anchor="middle" font-size="11.5" fill="#1f2933">&#8594; one PR comment &#183; pipeline.py</text>
  <text x="988" y="393" text-anchor="middle" font-size="11" fill="#5b6b7b">the dialogue with the student</text>

  <rect x="800" y="452" width="376" height="58" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="988" y="476" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Lecturer</text>
  <text x="988" y="495" text-anchor="middle" font-size="11.5" fill="#5b6b7b">adk web &#183; CLI</text>

  <line x1="718" y1="222" x2="800" y2="209" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="748" y="204" text-anchor="middle" font-size="11" font-style="italic" fill="#5b6b7b">findings</text>
  <line x1="988" y1="236" x2="988" y2="252" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <line x1="718" y1="420" x2="800" y2="372" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="748" y="392" text-anchor="middle" font-size="11" font-style="italic" fill="#5b6b7b">questions</text>
  <path d="M958,308 C 936,376 936,420 958,452" fill="none" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <line x1="980" y1="416" x2="1002" y2="452" stroke="#5b6b7b" marker-end="url(#arrow)"/>

  <!-- ===== firestore ===== -->
  <rect x="300" y="560" width="440" height="112" rx="10" fill="#fef7e0" stroke="#d9b23a"/>
  <text x="520" y="586" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">Firestore &#8212; store.py</text>
  <text x="520" y="606" text-anchor="middle" font-size="11.5" fill="#1f2933">reviews/{repo}#{pr}#{sha} &#183; students/{login}</text>
  <text x="520" y="624" text-anchor="middle" font-size="11.5" fill="#1f2933">classes/{id}/milestones/{milestone}</text>
  <text x="520" y="644" text-anchor="middle" font-size="11" fill="#5b6b7b">atomic Increment / ArrayUnion &#183; reserve-before-review lock</text>

  <path d="M814,416 C 782,472 760,540 722,560" fill="none" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="770" y="474" font-size="11" font-style="italic" fill="#5b6b7b">review + questions</text>
  <path d="M800,214 C 762,300 760,480 730,560" fill="none" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="742" y="360" font-size="11" font-style="italic" fill="#5b6b7b">class counts</text>
  <line x1="430" y1="560" x2="430" y2="488" stroke="#5b6b7b" marker-end="url(#arrow)"/>
  <text x="438" y="530" font-size="11" font-style="italic" fill="#5b6b7b">recurring misconceptions</text>

  <!-- ===== caption ===== -->
  <text x="24" y="698" font-size="11" fill="#5b6b7b">Deterministic layer (blue) &#183; LLM layer (green) &#183; Persistence (amber).  Student code is handled as data throughout; questions never contain fixes.</text>
</svg>
