<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="'Segoe UI', Roboto, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7a"/>
    </marker>
    <marker id="ahg" markerWidth="12" markerHeight="12" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#188038"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1000" fill="#ffffff"/>

  <!-- Header -->
  <text x="48" y="66" font-size="42" font-weight="700" fill="#1f2933">Co-Lectr</text>
  <text x="50" y="100" font-size="19" fill="#5b6b7a">Socratic code review for a classroom — delivered on every pull request, running on Google Cloud</text>

  <!-- ===== Left column: Student + GitHub ===== -->
  <rect x="55" y="150" width="290" height="80" rx="12" fill="#f3f4f6" stroke="#24292f" stroke-width="1.5"/>
  <text x="76" y="186" font-size="17" font-weight="600" fill="#1f2933">Student</text>
  <text x="76" y="210" font-size="13.5" fill="#5b6b7a">opens a pull request</text>

  <rect x="55" y="270" width="290" height="112" rx="12" fill="#f3f4f6" stroke="#24292f" stroke-width="1.5"/>
  <text x="76" y="305" font-size="17" font-weight="600" fill="#1f2933">GitHub repository</text>
  <text x="76" y="330" font-size="13.5" fill="#5b6b7a">pull-request webhook (HMAC-signed)</text>
  <text x="76" y="354" font-size="13.5" fill="#5b6b7a">receives the review comment</text>

  <line x1="200" y1="230" x2="200" y2="268" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ===== Google Cloud boundary ===== -->
  <rect x="400" y="140" width="1055" height="770" rx="16" fill="#f7fbff" stroke="#aecbfa" stroke-width="2"/>
  <circle cx="424" cy="168" r="6" fill="#1a73e8"/>
  <text x="440" y="174" font-size="17" font-weight="700" fill="#1a73e8">Google Cloud</text>

  <!-- Cloud Run box -->
  <rect x="430" y="200" width="515" height="548" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
  <text x="452" y="230" font-size="16" font-weight="700" fill="#1558c0">Cloud Run &#183; co-lectr service</text>

  <!-- Webhook receiver -->
  <rect x="452" y="246" width="470" height="66" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4"/>
  <text x="470" y="274" font-size="15" font-weight="600" fill="#1f2933">Webhook receiver &#183; web.py</text>
  <text x="470" y="296" font-size="12.5" fill="#5b6b7a">verify HMAC signature &#8594; 202 Accepted, hand off async</text>

  <!-- Worker -->
  <rect x="452" y="324" width="470" height="52" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.4"/>
  <text x="470" y="355" font-size="13.5" font-weight="600" fill="#1f2933">Async worker — bounded pool &#183; optional Cloud Tasks</text>

  <!-- Pipeline container -->
  <rect x="452" y="388" width="470" height="344" rx="12" fill="#ffffff" stroke="#9dc0f5" stroke-width="1.4"/>
  <text x="470" y="414" font-size="14" font-weight="700" fill="#1558c0">Review pipeline &#183; pipeline.py</text>

  <rect x="470" y="426" width="434" height="52" rx="8" fill="#e0f5f5" stroke="#12a4a4" stroke-width="1.3"/>
  <text x="486" y="450" font-size="14" font-weight="600" fill="#1f2933">1 &#183; Fetch PR source</text>
  <text x="486" y="469" font-size="12" fill="#5b6b7a">github.py — size-capped tarball</text>

  <rect x="470" y="490" width="434" height="56" rx="8" fill="#e0f5f5" stroke="#12a4a4" stroke-width="1.3"/>
  <text x="486" y="514" font-size="14" font-weight="600" fill="#1f2933">2 &#183; Layer 1 — static facts</text>
  <text x="486" y="533" font-size="12" fill="#5b6b7a">ruff &#183; pytest &#183; AST required-symbols</text>

  <rect x="470" y="558" width="434" height="66" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.3"/>
  <text x="486" y="582" font-size="14" font-weight="600" fill="#1f2933">3 &#183; Layer 2 — reviewer &#183; reviewer.py</text>
  <text x="486" y="601" font-size="12" fill="#5b6b7a">Gemini turns facts into Socratic questions</text>
  <text x="486" y="617" font-size="12" fill="#5b6b7a">validated &#183; prompt-injection guarded</text>

  <rect x="470" y="636" width="434" height="62" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.3"/>
  <text x="486" y="660" font-size="14" font-weight="600" fill="#1f2933">Deliver — one PR comment &#183; record review</text>
  <text x="486" y="679" font-size="12" fill="#5b6b7a">idempotent per repo#pr#sha</text>

  <!-- internal down arrows -->
  <line x1="687" y1="312" x2="687" y2="323" stroke="#5b6b7a" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="687" y1="376" x2="687" y2="425" stroke="#5b6b7a" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="687" y1="478" x2="687" y2="489" stroke="#5b6b7a" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="687" y1="546" x2="687" y2="557" stroke="#5b6b7a" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="687" y1="624" x2="687" y2="635" stroke="#5b6b7a" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- ===== Right column ===== -->
  <!-- Firestore -->
  <rect x="985" y="200" width="448" height="150" rx="12" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8"/>
  <text x="1006" y="232" font-size="16" font-weight="700" fill="#b06000">Firestore</text>
  <text x="1006" y="260" font-size="13.5" fill="#3c4a56">students/{id} — recurring habits</text>
  <text x="1006" y="284" font-size="13.5" fill="#3c4a56">classes/{id} — milestone digest</text>
  <text x="1006" y="312" font-size="12.5" fill="#5b6b7a">powers the &#8220;you&#8217;ve done this before&#8221; memory</text>

  <!-- Lecturer agent -->
  <rect x="985" y="378" width="448" height="140" rx="12" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.8"/>
  <text x="1006" y="410" font-size="16" font-weight="700" fill="#7b1fa2">Lecturer agent &#183; Google ADK</text>
  <text x="1006" y="438" font-size="13.5" fill="#3c4a56">adk web — reads the class digest</text>
  <text x="1006" y="468" font-size="15" font-style="italic" fill="#1f2933">&#8220;What did class 12-A get wrong?&#8221;</text>

  <!-- Gemini API -->
  <rect x="985" y="546" width="212" height="100" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
  <text x="1006" y="578" font-size="15" font-weight="700" fill="#1558c0">Gemini 3.5 Flash</text>
  <text x="1006" y="601" font-size="12.5" fill="#5b6b7a">code-review model</text>
  <text x="1006" y="621" font-size="12.5" fill="#5b6b7a">Google GenAI</text>

  <!-- Secret Manager -->
  <rect x="1221" y="546" width="212" height="100" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="1.8"/>
  <text x="1242" y="578" font-size="15" font-weight="700" fill="#0d652d">Secret Manager</text>
  <text x="1242" y="601" font-size="12.5" fill="#5b6b7a">Gemini key &#183; GitHub token</text>
  <text x="1242" y="621" font-size="12.5" fill="#5b6b7a">webhook secret</text>

  <!-- ===== Cross arrows ===== -->
  <!-- GitHub -> receiver -->
  <path d="M345,318 C400,300 420,285 450,278" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="352" y="262" font-size="12.5" font-weight="600" fill="#3c4a56">webhook</text>

  <!-- reviewer -> Gemini -->
  <path d="M906,590 C945,588 960,585 983,585" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="912" y="577" font-size="11.5" fill="#5b6b7a">prompt</text>

  <!-- deliver -> Firestore (elbow through the gap) -->
  <path d="M906,667 L957,667 L957,300 L983,300" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="963" y="470" font-size="12" font-weight="600" fill="#3c4a56" transform="rotate(-90 963 470)">record review</text>

  <!-- Firestore -> Lecturer -->
  <line x1="1209" y1="350" x2="1209" y2="376" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1219" y="369" font-size="11.5" fill="#5b6b7a">reads digest</text>

  <!-- Secret Manager -> Cloud Run (dashed, routed through the gap below the lecturer box) -->
  <path d="M1230,546 L1230,533 L946,533" fill="none" stroke="#188038" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" opacity="0.8"/>
  <text x="1006" y="527" font-size="11.5" fill="#188038">secrets</text>

  <!-- Deliver -> GitHub return (the PR comment) -->
  <path d="M600,698 L600,945 L200,945 L200,384" fill="none" stroke="#188038" stroke-width="2.6" marker-end="url(#ahg)"/>
  <rect x="300" y="924" width="360" height="26" rx="6" fill="#ffffff"/>
  <text x="318" y="942" font-size="13.5" font-weight="600" fill="#188038">post Socratic questions as a PR comment</text>

  <!-- footer tag -->
  <text x="985" y="682" font-size="12" fill="#8a97a3">Also: pytest sandboxing opt-in &#183; per-class config overrides</text>
</svg>
