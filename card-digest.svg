<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="'Segoe UI', Roboto, -apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="1000" fill="#ffffff"/>

  <!-- Header -->
  <text x="60" y="78" font-size="38" font-weight="700" fill="#1f2933">What did the class get wrong?</text>
  <text x="62" y="114" font-size="19" fill="#5b6b7a">Co-Lectr class digest — deterministic layer-1 findings, counted per class, most widespread first.</text>

  <!-- ===== Class 12-A ===== -->
  <text x="60" y="182" font-size="23" font-weight="700" fill="#1f2933">Class 12-A</text>
  <text x="215" y="182" font-size="17" fill="#5b6b7a">6 students</text>

  <!-- row template: fraction · bar · label · students -->
  <!-- 4/6 E722 -->
  <text x="60" y="238" font-size="26" font-weight="700" fill="#1f2933">4/6</text>
  <rect x="140" y="220" width="300" height="18" rx="9" fill="#eef1f4"/>
  <rect x="140" y="220" width="200" height="18" rx="9" fill="#12a4a4"/>
  <text x="470" y="228" font-size="18" font-weight="600" fill="#1f2933">Bare <tspan font-family="Consolas, monospace">except:</tspan> swallows every error</text>
  <text x="470" y="250" font-size="13.5" fill="#5b6b7a" font-family="Consolas, monospace">ruff:E722 · student_01, student_02, student_04, student_05</text>

  <!-- 4/6 F401 -->
  <text x="60" y="308" font-size="26" font-weight="700" fill="#1f2933">4/6</text>
  <rect x="140" y="290" width="300" height="18" rx="9" fill="#eef1f4"/>
  <rect x="140" y="290" width="200" height="18" rx="9" fill="#12a4a4"/>
  <text x="470" y="298" font-size="18" font-weight="600" fill="#1f2933">Imported a module that is never used</text>
  <text x="470" y="320" font-size="13.5" fill="#5b6b7a" font-family="Consolas, monospace">ruff:F401 · student_01, student_03, student_04, student_05</text>

  <!-- 2/6 F841 -->
  <text x="60" y="378" font-size="26" font-weight="700" fill="#1f2933">2/6</text>
  <rect x="140" y="360" width="300" height="18" rx="9" fill="#eef1f4"/>
  <rect x="140" y="360" width="100" height="18" rx="9" fill="#12a4a4"/>
  <text x="470" y="368" font-size="18" font-weight="600" fill="#1f2933">Assigned a local variable, then never read it</text>
  <text x="470" y="390" font-size="13.5" fill="#5b6b7a" font-family="Consolas, monospace">ruff:F841 · student_02, student_04</text>

  <!-- 2/6 spec -->
  <text x="60" y="448" font-size="26" font-weight="700" fill="#1f2933">2/6</text>
  <rect x="140" y="430" width="300" height="18" rx="9" fill="#fdf0d3"/>
  <rect x="140" y="430" width="100" height="18" rx="9" fill="#f9ab00"/>
  <text x="470" y="438" font-size="18" font-weight="600" fill="#1f2933">Never defined the required <tspan font-family="Consolas, monospace">run_agent</tspan></text>
  <text x="470" y="460" font-size="13.5" fill="#5b6b7a" font-family="Consolas, monospace">spec:missing-symbol · student_03, student_06</text>

  <text x="60" y="500" font-size="14.5" font-style="italic" fill="#8a97a3">+ 3 further findings hit one student each — individual feedback, not a class gap.</text>

  <line x1="60" y1="528" x2="1440" y2="528" stroke="#e6eaee" stroke-width="1.5"/>

  <!-- ===== Class 12-B ===== -->
  <text x="60" y="576" font-size="23" font-weight="700" fill="#1f2933">Class 12-B</text>
  <text x="215" y="576" font-size="17" fill="#5b6b7a">4 students</text>

  <!-- 3/4 E722 -->
  <text x="60" y="632" font-size="26" font-weight="700" fill="#1f2933">3/4</text>
  <rect x="140" y="614" width="300" height="18" rx="9" fill="#eef1f4"/>
  <rect x="140" y="614" width="225" height="18" rx="9" fill="#12a4a4"/>
  <text x="470" y="622" font-size="18" font-weight="600" fill="#1f2933">Bare <tspan font-family="Consolas, monospace">except:</tspan> swallows every error</text>
  <text x="470" y="644" font-size="13.5" fill="#5b6b7a" font-family="Consolas, monospace">ruff:E722 · student_07, student_08, student_09</text>

  <!-- 2/4 F841 -->
  <text x="60" y="702" font-size="26" font-weight="700" fill="#1f2933">2/4</text>
  <rect x="140" y="684" width="300" height="18" rx="9" fill="#eef1f4"/>
  <rect x="140" y="684" width="150" height="18" rx="9" fill="#12a4a4"/>
  <text x="470" y="692" font-size="18" font-weight="600" fill="#1f2933">Assigned a local variable, then never read it</text>
  <text x="470" y="714" font-size="13.5" fill="#5b6b7a" font-family="Consolas, monospace">ruff:F841 · student_07, student_09</text>

  <text x="60" y="754" font-size="14.5" font-style="italic" fill="#8a97a3">+ 2 further findings hit one student each.</text>

  <!-- Footer callout -->
  <rect x="60" y="800" width="1380" height="120" rx="14" fill="#f7fbff" stroke="#aecbfa" stroke-width="1.5"/>
  <text x="90" y="852" font-size="19" font-weight="700" fill="#1558c0">Counted per class — never pooled.</text>
  <text x="90" y="884" font-size="16.5" fill="#3c4a56">“4 of 6 in 12-A” is a reteach signal. The same four averaged across every class would erase it —</text>
  <text x="90" y="908" font-size="16.5" fill="#3c4a56">and this is a number that exists in no single student’s repository.</text>
</svg>
